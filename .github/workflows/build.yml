name: Build FastLauncher APK

# Single-file setup: only this file is needed at .github/workflows/build.yml

on:
  push:
    branches: ["**"]
    paths: [".github/workflows/build.yml"]
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: Base launcher repo (owner/name)
        default: MojoLauncher/MojoLauncher
      upstream_ref:
        description: Branch or tag (leave empty for the default branch)
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base launcher
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.upstream_repo || 'MojoLauncher/MojoLauncher' }}
          ref: ${{ inputs.upstream_ref }}
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Add FastLauncher performance code
        run: |
          set -euo pipefail
          echo "== top-level =="; ls; echo "== settings =="; cat settings.gradle* 2>/dev/null | head -40 || true
          # --- find the Android app module automatically ---
          CANDS=$(grep -rlE "android\.application" --include=build.gradle --include=build.gradle.kts . 2>/dev/null | grep -vE '^\./build\.gradle(\.kts)?$' || true)
          echo "App module candidates: $CANDS"
          APP_FILE=$(echo "$CANDS" | grep -i pojav | head -n1 || true)
          [ -n "$APP_FILE" ] || APP_FILE=$(echo "$CANDS" | head -n1 || true)
          [ -n "$APP_FILE" ] || { echo "No Android app module found"; exit 1; }
          APP_DIR=$(dirname "$APP_FILE" | sed 's|^\./||')
          MODULE=":$(echo "$APP_DIR" | tr '/' ':')"
          echo "Using app module: $MODULE (dir $APP_DIR)"
          echo "APP_MODULE=$MODULE" >> "$GITHUB_ENV"
          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"
          [ -f "$MANIFEST" ] || { echo "Manifest not found: $MANIFEST"; find "$APP_DIR" -name AndroidManifest.xml | head; exit 1; }
          mkdir -p "$(dirname "$APP_DIR/src/main/assets/presets/options_balanced.txt")"
          cat > "$APP_DIR/src/main/assets/presets/options_balanced.txt" <<'FL_EOF'
          renderDistance:8
          simulationDistance:6
          graphicsMode:0
          particles:1
          ao:true
          entityShadows:false
          cloudRenderMode:"off"
          biomeBlendRadius:1
          mipmapLevels:2
          entityDistanceScaling:0.75
          maxFps:260
          enableVsync:false
          guiScale:2
          FL_EOF
          mkdir -p "$(dirname "$APP_DIR/src/main/assets/presets/options_low.txt")"
          cat > "$APP_DIR/src/main/assets/presets/options_low.txt" <<'FL_EOF'
          renderDistance:5
          simulationDistance:5
          graphicsMode:0
          particles:2
          ao:false
          entityShadows:false
          cloudRenderMode:"off"
          biomeBlendRadius:0
          mipmapLevels:0
          entityDistanceScaling:0.5
          maxFps:260
          enableVsync:false
          bobView:false
          guiScale:2
          FL_EOF
          mkdir -p "$(dirname "$APP_DIR/src/main/assets/presets/performance_profiles.json")"
          cat > "$APP_DIR/src/main/assets/presets/performance_profiles.json" <<'FL_EOF'
          {
            "version": 1,
            "profiles": {
              "potato": {
                "minRamMb": 0,
                "xmxMb": 1024,
                "jvmArgs": ["-XX:+UseSerialGC","-XX:TieredStopAtLevel=1","-Xshare:auto","-XX:+DisableExplicitGC"],
                "options": "options_low.txt",
                "mods": ["modernfix","ferrite-core","entityculling"]
              },
              "balanced": {
                "minRamMb": 4000,
                "xmxMb": 1536,
                "jvmArgs": ["-XX:+UseG1GC","-XX:MaxGCPauseMillis=50","-XX:+UnlockExperimentalVMOptions","-XX:G1NewSizePercent=30","-XX:+DisableExplicitGC","-Xshare:auto"],
                "options": "options_balanced.txt",
                "mods": ["lithium","modernfix","ferrite-core","entityculling","immediatelyfast"]
              },
              "max_fps": {
                "minRamMb": 8000,
                "xmxMb": 2560,
                "jvmArgs": ["-XX:+UseG1GC","-XX:MaxGCPauseMillis=30","-XX:+UnlockExperimentalVMOptions","-XX:G1NewSizePercent=40","-XX:G1ReservePercent=15","-XX:+DisableExplicitGC","-XX:+AlwaysPreTouch","-Xshare:auto"],
                "options": "options_balanced.txt",
                "mods": ["lithium","modernfix","ferrite-core","entityculling","immediatelyfast","sodium"],
                "note": "sodium needs OpenGL 3.2+: use only with Zink/ANGLE-class renderers, not gl4es"
              }
            }
          }
          FL_EOF
          mkdir -p "$(dirname "$APP_DIR/src/main/java/com/fastlauncher/perf/DeviceProfiler.java")"
          cat > "$APP_DIR/src/main/java/com/fastlauncher/perf/DeviceProfiler.java" <<'FL_EOF'
          package com.fastlauncher.perf;

          import android.app.ActivityManager;
          import android.content.Context;

          public final class DeviceProfiler {
              private DeviceProfiler() {}

              public static long totalMb(Context c) {
                  ActivityManager am = (ActivityManager) c.getSystemService(Context.ACTIVITY_SERVICE);
                  ActivityManager.MemoryInfo info = new ActivityManager.MemoryInfo();
                  am.getMemoryInfo(info);
                  return info.totalMem / (1024 * 1024);
              }

              public static Tier recommend(Context c) {
                  long mb = totalMb(c);
                  if (mb >= 8000) return Tier.MAX_FPS;
                  if (mb >= 4000) return Tier.BALANCED;
                  return Tier.POTATO;
              }

              /** Never give the JVM more than ~40% of total RAM. */
              public static int safeXmxMb(Context c, int wantedMb) {
                  return Math.min(wantedMb, (int) (totalMb(c) * 0.4));
              }
          }
          FL_EOF
          mkdir -p "$(dirname "$APP_DIR/src/main/java/com/fastlauncher/perf/FpsHook.java")"
          cat > "$APP_DIR/src/main/java/com/fastlauncher/perf/FpsHook.java" <<'FL_EOF'
          package com.fastlauncher.perf;

          import android.app.Activity;
          import android.app.Application;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;

          /** Adds the FPS overlay on top of the game activity (class named "MainActivity") when enabled. */
          public class FpsHook implements Application.ActivityLifecycleCallbacks {
              private static final String TAG = "fl_fps_overlay";

              @Override public void onActivityResumed(Activity a) {
                  if (!"MainActivity".equals(a.getClass().getSimpleName())) return;
                  if (!ProfileManager.own(a).getBoolean("fps_overlay", false)) return;
                  ViewGroup content = a.findViewById(android.R.id.content);
                  if (content == null || content.findViewWithTag(TAG) != null) return;
                  FpsOverlay o = new FpsOverlay(a);
                  o.setTag(TAG);
                  content.addView(o, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP | Gravity.START));
              }

              @Override public void onActivityPaused(Activity a) {
                  ViewGroup content = a.findViewById(android.R.id.content);
                  if (content == null) return;
                  View v = content.findViewWithTag(TAG);
                  if (v != null) content.removeView(v);
              }

              @Override public void onActivityCreated(Activity a, Bundle b) {}
              @Override public void onActivityStarted(Activity a) {}
              @Override public void onActivityStopped(Activity a) {}
              @Override public void onActivitySaveInstanceState(Activity a, Bundle b) {}
              @Override public void onActivityDestroyed(Activity a) {}
          }
          FL_EOF
          mkdir -p "$(dirname "$APP_DIR/src/main/java/com/fastlauncher/perf/FpsOverlay.java")"
          cat > "$APP_DIR/src/main/java/com/fastlauncher/perf/FpsOverlay.java" <<'FL_EOF'
          package com.fastlauncher.perf;

          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.Color;
          import android.os.BatteryManager;
          import android.view.Choreographer;
          import android.widget.TextView;

          public class FpsOverlay extends TextView implements Choreographer.FrameCallback {
              private int frames = 0;
              private long last = System.nanoTime();

              public FpsOverlay(Context c) {
                  super(c);
                  setTextColor(Color.GREEN);
                  setTextSize(11f);
                  setBackgroundColor(0x88000000);
                  setPadding(10, 4, 10, 4);
                  setText("FPS ...");
              }

              @Override protected void onAttachedToWindow() {
                  super.onAttachedToWindow();
                  Choreographer.getInstance().postFrameCallback(this);
              }

              @Override protected void onDetachedFromWindow() {
                  Choreographer.getInstance().removeFrameCallback(this);
                  super.onDetachedFromWindow();
              }

              @Override public void doFrame(long frameTimeNanos) {
                  frames++;
                  long now = System.nanoTime();
                  if (now - last >= 1_000_000_000L) {
                      Intent i = getContext().registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                      float temp = i == null ? 0f : i.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) / 10f;
                      setText("FPS " + frames + " | " + temp + "\u00B0C");
                      frames = 0;
                      last = now;
                  }
                  Choreographer.getInstance().postFrameCallback(this);
              }
          }
          FL_EOF
          mkdir -p "$(dirname "$APP_DIR/src/main/java/com/fastlauncher/perf/ModInstaller.java")"
          cat > "$APP_DIR/src/main/java/com/fastlauncher/perf/ModInstaller.java" <<'FL_EOF'
          package com.fastlauncher.perf;

          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.List;

          /** Downloads the newest compatible build of each mod from Modrinth. Call off the main thread. */
          public final class ModInstaller {
              private ModInstaller() {}

              public interface Log { void line(String s); }

              private static final String API = "https://api.modrinth.com/v2";

              public static void install(List<String> slugs, String mcVersion, String loader, File modsDir, Log log) {
                  modsDir.mkdirs();
                  for (String slug : slugs) {
                      try {
                          String gv = URLEncoder.encode("[\"" + mcVersion + "\"]", "UTF-8");
                          String ld = URLEncoder.encode("[\"" + loader + "\"]", "UTF-8");
                          JSONArray versions = new JSONArray(new String(
                                  download(API + "/project/" + slug + "/version?game_versions=" + gv + "&loaders=" + ld), "UTF-8"));
                          if (versions.length() == 0) { log.line(slug + ": no build for " + mcVersion + "/" + loader); continue; }
                          JSONObject f = versions.getJSONObject(0).getJSONArray("files").getJSONObject(0);
                          File out = new File(modsDir, f.getString("filename"));
                          if (!out.exists()) {
                              byte[] data = download(f.getString("url"));
                              try (FileOutputStream os = new FileOutputStream(out)) { os.write(data); }
                          }
                          log.line(slug + ": OK");
                      } catch (Exception e) {
                          log.line(slug + ": failed (" + e.getMessage() + ")");
                      }
                  }
              }

              private static byte[] download(String u) throws Exception {
                  HttpURLConnection c = (HttpURLConnection) new URL(u).openConnection();
                  c.setRequestProperty("User-Agent", "FastLauncher/1.0");
                  c.setConnectTimeout(15000);
                  c.setReadTimeout(30000);
                  try (InputStream in = c.getInputStream()) {
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      return out.toByteArray();
                  } finally { c.disconnect(); }
              }
          }
          FL_EOF
          mkdir -p "$(dirname "$APP_DIR/src/main/java/com/fastlauncher/perf/PerfInitProvider.java")"
          cat > "$APP_DIR/src/main/java/com/fastlauncher/perf/PerfInitProvider.java" <<'FL_EOF'
          package com.fastlauncher.perf;

          import android.app.Application;
          import android.content.ContentProvider;
          import android.content.ContentValues;
          import android.content.Context;
          import android.database.Cursor;
          import android.net.Uri;

          /** Auto-runs at app start (no code changes needed in the launcher). */
          public class PerfInitProvider extends ContentProvider {
              @Override public boolean onCreate() {
                  Context c = getContext();
                  if (c == null) return true;
                  try {
                      if (!ProfileManager.own(c).getBoolean("first_done", false)) {
                          ProfileManager.applyToLauncher(c, DeviceProfiler.recommend(c), false);
                          ProfileManager.own(c).edit().putBoolean("first_done", true).apply();
                      }
                  } catch (Exception ignored) {}
                  Context app = c.getApplicationContext();
                  if (app instanceof Application) {
                      ((Application) app).registerActivityLifecycleCallbacks(new FpsHook());
                  }
                  return true;
              }

              @Override public Cursor query(Uri u, String[] p, String s, String[] a, String o) { return null; }
              @Override public String getType(Uri u) { return null; }
              @Override public Uri insert(Uri u, ContentValues v) { return null; }
              @Override public int delete(Uri u, String s, String[] a) { return 0; }
              @Override public int update(Uri u, ContentValues v, String s, String[] a) { return 0; }
          }
          FL_EOF
          mkdir -p "$(dirname "$APP_DIR/src/main/java/com/fastlauncher/perf/PerfSettingsActivity.java")"
          cat > "$APP_DIR/src/main/java/com/fastlauncher/perf/PerfSettingsActivity.java" <<'FL_EOF'
          package com.fastlauncher.perf;

          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.*;
          import java.io.File;

          public class PerfSettingsActivity extends Activity {
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  final SharedPreferences own = ProfileManager.own(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(40, 40, 40, 40);

                  Tier rec = DeviceProfiler.recommend(this);
                  TextView info = new TextView(this);
                  info.setText("RAM: " + DeviceProfiler.totalMb(this) + " MB\nGPU: " + RendererSelector.detectGpu()
                          + "\nRecommended: " + rec.id + "\nRenderer suggestion: " + RendererSelector.recommend(rec));
                  root.addView(info);

                  final RadioGroup group = new RadioGroup(this);
                  for (Tier t : Tier.values()) {
                      RadioButton rb = new RadioButton(this);
                      rb.setText(t.id);
                      rb.setTag(t);
                      rb.setId(View.generateViewId());
                      rb.setChecked(t == rec);
                      group.addView(rb);
                  }
                  root.addView(group);

                  final EditText version = new EditText(this);
                  version.setHint("Minecraft version, e.g. 1.20.1");
                  version.setText(own.getString("mc_version", "1.20.1"));
                  root.addView(version);

                  final EditText dir = new EditText(this);
                  dir.setHint("Game directory");
                  File guess = new File(getExternalFilesDir(null), ".minecraft");
                  dir.setText(own.getString("game_dir", guess.getAbsolutePath()));
                  root.addView(dir);

                  final Spinner loader = new Spinner(this);
                  loader.setAdapter(new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item,
                          new String[]{"fabric", "quilt", "forge", "neoforge"}));
                  root.addView(loader);

                  final CheckBox fps = new CheckBox(this);
                  fps.setText("Show FPS overlay in game");
                  fps.setChecked(own.getBoolean("fps_overlay", false));
                  final CheckBox renderer = new CheckBox(this);
                  renderer.setText("Apply suggested renderer (experimental)");
                  final CheckBox opts = new CheckBox(this);
                  opts.setText("Write options.txt (overwrites)");
                  final CheckBox mods = new CheckBox(this);
                  mods.setText("Install optimization mods");
                  root.addView(fps); root.addView(renderer); root.addView(opts); root.addView(mods);

                  final TextView log = new TextView(this);
                  Button apply = new Button(this);
                  apply.setText("Apply");
                  apply.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) {
                          final Tier tier = (Tier) group.findViewById(group.getCheckedRadioButtonId()).getTag();
                          final File gameDir = new File(dir.getText().toString().trim());
                          final String mc = version.getText().toString().trim();
                          final String ld = (String) loader.getSelectedItem();
                          own.edit().putBoolean("fps_overlay", fps.isChecked())
                                  .putString("mc_version", mc).putString("game_dir", gameDir.getAbsolutePath()).apply();
                          try {
                              ProfileManager.applyToLauncher(PerfSettingsActivity.this, tier, renderer.isChecked());
                              log.setText("Applied " + tier.id + " (RAM + JVM args)\n");
                              if (opts.isChecked()) {
                                  ProfileManager.writeOptions(PerfSettingsActivity.this, tier, gameDir);
                                  log.append("options.txt written\n");
                              }
                     
